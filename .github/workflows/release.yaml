name: Release Addon

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout external repo
        uses: actions/checkout@v4
        with:
          repository: Hildaware/ConsoleBags
          ref: wipe
          path: external-repo

      - name: Create Zip
        run: |
          # Name of the folder inside the zip (usually your Addon name)
          ADDON_NAME="CouchMode"
          ZIP_NAME="${ADDON_NAME}-${{ github.ref_name }}.zip"
          
          # Create a staging directory
          mkdir -p staging/$ADDON_NAME
          
          # Copy every required addon directory and entry point.
          cp -r Core Libs Modules Resources \
            Bindings.xml CouchMode.toc CouchMode.lua "staging/$ADDON_NAME/"

          mkdir -p staging/ConsoleBags
          cp external-repo/ConsoleBags.lua staging/ConsoleBags/
          cp external-repo/ConsoleBags.toc staging/ConsoleBags/
          
          # Navigate to staging and zip the folder
          cd staging
          zip -r ../$ZIP_NAME $ADDON_NAME ConsoleBags
          cd ..
          
          # Set environment variable for the next step
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV



      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
